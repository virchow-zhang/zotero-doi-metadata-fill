name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          fetch-all: true

      - name: Build
        run: npm run build

      - name: Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is e.g. "v0.1.0"; strip the leading "v" for the version arg.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: ${VERSION}"
          # Official non-interactive release: explicit version + -y skips the prompt.
          npm run release -- "${VERSION}" -y
