name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-plugin.yml@main
    with:
      build: "npm run build"
      # Non-interactive release: derive version from the tag (strip leading 'v'),
      # skip confirmation prompts (bumpp would otherwise hang waiting for TTY input in CI)
      release: "npx bumpp --release ${GITHUB_REF_NAME#v} -y --no-push --no-git-check --no-verify"
    secrets: inherit
