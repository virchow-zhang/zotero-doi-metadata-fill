name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          fetch-all: true

      - name: Build
        run: npm run build

      - name: Create GitHub Release with xpi asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          XPI=".scaffold/build/doi-metadata-fill.xpi"
          echo "Releasing v${VERSION} from ${XPI}"
          test -f "$XPI" || { echo "ERROR: xpi not found"; exit 1; }
          gh release create "v${VERSION}" \
            "$XPI" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DOI Metadata Fill v${VERSION}" \
            --generate-notes
          echo "Release created: v${VERSION}"
          gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}"
